" font-weight="600" fill="#C9D1D9">Puissance 5 (CY-Connect)</text><text x="215" y="299" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Jeu d'alignement à rotation de zone pour 2 ou 3 joueurs, en C</text><text x="215" y="327" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#C9D1D9">Crash Tech</text><text x="215" y="347" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Accidents de la route en France (2005-2024), en C, projet CY Tech</text><line x1="30" y1="366" x2="690" y2="366" stroke="#30363D"/><text x="30" y="395" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3FB950">Programmation et IA</text><text x="215" y="395" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#C9D1D9">aviation-radar</text><text x="215" y="415" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Radar ATC généré à partir des statistiques GitHub</text><text x="215" y="443" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#C9D1D9">fiche-revision</text><text x="215" y="463" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Transforme un PDF de cours en fiche, quiz ou correction de DS</text><text x="215" y="491" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#C9D1D9">car-tracking</text><text x="215" y="511" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Suivi de véhicules avec YOLOv8 et OpenCV (dépôt privé)</text>
