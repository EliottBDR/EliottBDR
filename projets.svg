<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546" role="img" aria-label="Projets. Concours : Airbus Fly Your Ideas 2026, Game Jam Solstice (juin 2026). Programmation et mécanique : afficheur de trains (ESP32 et écran e-paper), Morvran (drone à voilure fixe en mousse, en cours). École : Puissance 5 (CY-Connect, jeu d'alignement à rotation de zone, en C), Crash Tech (statistiques sur les accidents de la route, en C). Programmation et IA : aviation-radar, fiche-revision, car-tracking." xmlns:c2pa="http://c2pa.org/manifest">
<title>Projets</title>
